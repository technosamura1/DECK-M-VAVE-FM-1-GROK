<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sound juno</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00e5ff}a:hover{color:#ffffff}
.osd{text-shadow:-1.5px 0 rgba(255,40,100,0.6),1.5px 0 rgba(0,229,255,0.6),2px 3px 0 #000000}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; background: repeating-conic-gradient(#0b0626 0% 25%, #0e0832 0% 50%) 0 0 / 6px 6px; font-family: 'VT323', monospace; color: #ffffff; display: flex; flex-direction: column">
<div style="height: 40px; flex-shrink: 0; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; background: #05021a; font-size: 24px">
<span style="font-size: 26px">SOUND</span>
<span style="background: #00e5ff; color: #0a0318; padding: 0 6px; line-height: 24px">3</span>
<span>PAD</span>
<div style="flex-grow: 1"></div>
<span style="color: #c9b8ff">JUNO</span>
</div>

<div style="flex-shrink: 0; height: 84px; display: flex; align-items: center; justify-content: center; gap: 22px">
<svg width="18" height="28" viewBox="0 0 6 10" aria-hidden="true"><polygon points="6,0 0,5 6,10" fill="#6a5aa0"></polygon></svg>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 64px; line-height: 56px; letter-spacing: 3px; text-shadow: -3px 0 rgba(255,40,100,0.75), 3px 0 rgba(0,229,255,0.75), 5px 5px 0 #000000">SUNSET</span>
<span style="font-size: 20px; color: #c9b8ff">04 / 16</span>
</div>
<svg width="18" height="28" viewBox="0 0 6 10" aria-hidden="true"><polygon points="0,0 6,5 0,10" fill="#6a5aa0"></polygon></svg>
</div>

<div style="flex-shrink: 0; box-sizing: border-box; padding: 6px 14px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="border: 2px solid #ff2a8a; display: flex; flex-direction: column">
<svg width="144" height="120" viewBox="0 0 72 60" shape-rendering="crispEdges" aria-hidden="true" style="display: block; width: 100%; height: auto">
<rect x="0" y="0" width="72" height="12" fill="#240a4a"></rect>
<rect x="0" y="12" width="72" height="12" fill="#3d0d5e"></rect>
<rect x="0" y="24" width="72" height="10" fill="#8e1c6a"></rect>
<rect x="0" y="34" width="72" height="8" fill="#f0506a"></rect>
<defs><clipPath id="sc"><rect x="0" y="0" width="72" height="42"></rect></clipPath></defs>
<g clip-path="url(#sc)">
<circle cx="36" cy="40" r="14" fill="#ffc23d"></circle>
<rect x="20" y="36" width="32" height="1.5" fill="#f0506a"></rect>
<rect x="20" y="39.5" width="32" height="1.5" fill="#f0506a"></rect>
</g>
<rect x="0" y="42" width="72" height="18" fill="#0a0318"></rect>
<rect x="0" y="42" width="72" height="1" fill="#ff2a8a"></rect>
<g stroke="#7a2bff" stroke-width="0.5" shape-rendering="auto"><line x1="36" y1="42" x2="0" y2="60"></line><line x1="36" y1="42" x2="72" y2="60"></line><line x1="36" y1="42" x2="24" y2="60"></line><line x1="36" y1="42" x2="48" y2="60"></line><line x1="0" y1="48" x2="72" y2="48"></line><line x1="0" y1="55" x2="72" y2="55"></line></g>
</svg>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 4px; font-size: 20px"><span style="color: #ff8cc4">CUTOFF</span><span style="font-size: 26px">62</span></div>
</div>
<div style="border: 2px solid #00e5ff; display: flex; flex-direction: column">
<svg width="144" height="120" viewBox="0 0 72 60" aria-hidden="true" style="display: block; width: 100%; height: auto; background: #071a2e">
<path d="M0 30 C 6 18, 12 18, 18 30 S 30 42, 36 30 S 48 18, 54 30 S 66 42, 72 30" fill="none" stroke="#00e5ff" stroke-width="2"></path>
<path d="M0 34 C 6 22, 12 22, 18 34 S 30 46, 36 34 S 48 22, 54 34 S 66 46, 72 34" fill="none" stroke="#ff2a8a" stroke-width="2" transform="translate(5 0)"></path>
<text x="62" y="14" font-family="VT323, monospace" font-size="12" fill="#a8f4ff">II</text>
</svg>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 4px; font-size: 20px"><span style="color: #a8f4ff">CHORUS</span><span style="font-size: 26px">II</span></div>
</div>
<div style="border: 2px solid #ff8a00; display: flex; flex-direction: column">
<svg width="144" height="120" viewBox="0 0 72 60" aria-hidden="true" style="display: block; width: 100%; height: auto; background: #1d0c14">
<rect x="0" y="0" width="72" height="60" fill="#140818"></rect>
<polygon points="2,54 16,14 30,22 44,22 70,54" fill="#3a1424"></polygon>
<polyline points="2,54 16,14 30,22 44,22 70,54" fill="none" stroke="#ff8a00" stroke-width="2" stroke-linejoin="round"></polyline>
<rect x="6" y="6" width="1" height="1" fill="#ffffff"></rect><rect x="58" y="10" width="1" height="1" fill="#ffffff"></rect><rect x="40" y="5" width="1" height="1" fill="#ffd23f"></rect>
<line x1="0" y1="54" x2="72" y2="54" stroke="#5a2a2a" stroke-width="1"></line>
</svg>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 8px 4px; font-size: 20px"><span style="color: #ffcf99">RELEASE</span><span style="font-size: 26px">1.8S</span></div>
</div>
</div>

<div style="flex-shrink: 0; box-sizing: border-box; padding: 12px 14px 0; display: flex; flex-direction: column; gap: 6px; font-size: 22px">
<div style="display: flex; align-items: center; gap: 10px; border-top: 1px solid #2a1a55; padding-top: 6px">
<span style="color: #c9b8ff; width: 56px">FX</span>
<span>CHORUS II</span>
<div style="flex-grow: 1"></div>
<span style="color: #c9b8ff">ECHO 30  REV 45</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="color: #c9b8ff; width: 56px">MOD</span>
<span>SWING</span>
<svg width="16" height="12" viewBox="0 0 9 7" aria-hidden="true"><polygon points="0,2 5,2 5,0 9,3.5 5,7 5,5 0,5" fill="#ff2a8a"></polygon></svg>
<span style="color: #ff8cc4">CUTOFF</span>
<div style="flex-grow: 1"></div>
<span style="color: #c9b8ff">1 BAR</span>
</div>
</div>

<div style="flex-grow: 1"></div>
<div style="height: 36px; flex-shrink: 0; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 20px; color: #c9b8ff; background: #05021a">
<span>PAGE 1/3</span>
<span>HOLD SAVE = STORE</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px)"></div>
<svg aria-hidden="true" width="480" height="480" style="position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0.08; mix-blend-mode: screen">
<filter id="nz5"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="9"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="480" height="480" filter="url(#nz5)"></rect>
</svg>
<div aria-hidden="true" style="position: absolute; left: 0; top: 128px; width: 480px; height: 4px; pointer-events: none; background: rgba(255,255,255,0.07)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,0.45) 100%)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
