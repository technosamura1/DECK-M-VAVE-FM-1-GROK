<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keys chords</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#ffd23f}
.osd{text-shadow:-1.5px 0 rgba(255,40,100,0.6),1.5px 0 rgba(0,229,255,0.6),2px 3px 0 #000a4a}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; background: repeating-linear-gradient(0deg, #1430b8 0px, #1430b8 2px, #1029a6 2px, #1029a6 4px); font-family: 'VT323', monospace; color: #ffffff; display: flex; flex-direction: column">
<div class="osd" style="height: 40px; flex-shrink: 0; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 30px">
<span>MENU</span>
<span style="color: #ffd23f">KEYS</span>
<div style="flex-grow: 1"></div>
<span>A MINOR</span>
</div>

<div style="flex-shrink: 0; box-sizing: border-box; padding: 2px 16px; display: flex; flex-direction: column; gap: 0">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="height: 26px; display: flex; align-items: center; gap: 10px; padding: 0 8px; font-size: 24px; background: {{r.bg}}; color: {{r.fg}}; text-shadow: {{r.shadow}}">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{r.dot}}"></span>
<span>{{r.label}}</span>
<div style="flex-grow: 1"></div>
<span>{{r.value}}</span>
</div>
</sc-for>
</div>

<div style="flex-shrink: 0; height: 46px; display: flex; align-items: center; justify-content: center; gap: 14px; text-shadow: 2px 2px 0 #000a4a">
<span style="font-size: 24px; color: #c8d4ff">KEY 4</span>
<svg width="18" height="14" viewBox="0 0 9 7" aria-hidden="true"><polygon points="0,2 5,2 5,0 9,3.5 5,7 5,5 0,5" fill="#ffd23f"></polygon></svg>
<span class="osd" style="font-size: 48px; line-height: 40px">DM9</span>
<span style="font-size: 24px; color: #c8d4ff">IV</span>
</div>

<div style="flex-shrink: 0; box-sizing: border-box; padding: 0 14px; position: relative; height: 92px">
<div style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; height: 60px">
<sc-for list="{{whites}}" as="w" hint-placeholder-count="16">
<span style="background: {{w.bg}}; border-bottom: 4px solid {{w.edge}}"></span>
</sc-for>
</div>
<div style="position: absolute; left: 14px; top: 0; width: 452px; height: 36px">
<sc-for list="{{blacks}}" as="b" hint-placeholder-count="11">
<span style="position: absolute; top: 0; width: 16px; height: 36px; background: #140a3a; left: {{b.left}}"></span>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; margin-top: 4px">
<sc-for list="{{whites}}" as="w" hint-placeholder-count="16">
<span style="font-size: 14px; line-height: 12px; text-align: center; color: {{w.labelColor}}">{{w.label}}</span>
</sc-for>
</div>
</div>

<div style="flex-grow: 1; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 20px; color: #c8d4ff">
<span>EDIT = BACK</span>
<span>HOME + KEY = ROOT</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px)"></div>
<svg aria-hidden="true" width="480" height="480" style="position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0.1; mix-blend-mode: screen">
<filter id="nz3"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="11"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="480" height="480" filter="url(#nz3)"></rect>
</svg>
<div aria-hidden="true" style="position: absolute; left: 0; top: 396px; width: 480px; height: 6px; pointer-events: none; background: rgba(255,255,255,0.1); box-shadow: 0 3px 0 rgba(255,255,255,0.05)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,30,0.5) 100%)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var list = [
      ['LAYOUT', 'SCALE', ''],
      ['ROOT', 'A', ''],
      ['MODE', 'MINOR', ''],
      ['WHITE', 'CHORDS', '#ff2a8a'],
      ['BLACK', 'CHORDS', ''],
      ['CHORD', 'MIN9', '#00e5ff'],
      ['QUALITY', 'DIATONIC', ''],
      ['VOICING', 'OPEN', '#ff8a00'],
      ['STRUM', '30 MS', ''],
      ['SPLIT', 'ON', '']
    ];
    var sel = 3;
    var rows = list.map(function (r, i) {
      var s = i === sel;
      return {
        label: r[0], value: r[1],
        dot: r[2] || 'transparent',
        bg: s ? '#ffffff' : 'transparent',
        fg: s ? '#1029a6' : '#ffffff',
        shadow: s ? 'none' : '2px 2px 0 #000a4a'
      };
    });
    var q = ['M9', 'SUS', 'MJ9', 'M9', 'M9', 'MJ9', '9'];
    var whites = [];
    for (var i = 0; i < 16; i++) {
      var pressed = i === 3;
      whites.push({
        bg: pressed ? '#ff2a8a' : '#e9ecff',
        edge: pressed ? '#ffd23f' : '#9aa6e8',
        label: q[i % 7],
        labelColor: pressed ? '#ffd23f' : '#c8d4ff'
      });
    }
    var after = [0, 1, 2, 4, 5, 7, 8, 9, 11, 12, 14];
    var kw = (452 + 2) / 16;
    var blacks = after.map(function (k) { return { left: Math.round((k + 1) * kw - 9) + 'px' }; });
    return { rows: rows, whites: whites, blacks: blacks };
  }
}
</script>
</body>
</html>
