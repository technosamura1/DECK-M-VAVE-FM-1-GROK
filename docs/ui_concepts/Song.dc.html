<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Road song</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00e5ff}a:hover{color:#ffffff}
.osd{text-shadow:-1.5px 0 rgba(255,40,100,0.6),1.5px 0 rgba(0,229,255,0.6),2px 3px 0 #000000}
</style>
</helmet>
<div style="width: 480px; height: 480px; position: relative; overflow: hidden; background: repeating-conic-gradient(#0a0420 0% 25%, #0d062a 0% 50%) 0 0 / 6px 6px; font-family: 'VT323', monospace; color: #ffffff">
<svg width="480" height="480" viewBox="0 0 480 480" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<g stroke="#2a1a55" stroke-width="1" opacity="0.6">
<line x1="0" y1="320" x2="480" y2="320"></line>
</g>
<path d="M60 100 H420 A45 45 0 0 1 420 190 H60 A45 45 0 0 0 60 280 H420" fill="none" stroke="#1b1036" stroke-width="34"></path>
<path d="M60 100 H420 A45 45 0 0 1 420 190 H60 A45 45 0 0 0 60 280 H420" fill="none" stroke="#3a2a70" stroke-width="36" stroke-opacity="0.35"></path>
<g shape-rendering="crispEdges">
<rect x="60" y="88" width="76" height="24" fill="#7a2bff" opacity="0.45"></rect>
<rect x="140" y="88" width="136" height="24" fill="#00e5ff"></rect>
<rect x="280" y="88" width="140" height="24" fill="#ff2a8a"></rect>
<rect x="320" y="178" width="100" height="24" fill="#ffd23f"></rect>
<rect x="156" y="178" width="160" height="24" fill="#ff2a8a"></rect>
<rect x="60" y="178" width="92" height="24" fill="none" stroke="#6a5aa0" stroke-width="2" stroke-dasharray="6 4"></rect>
<rect x="60" y="268" width="100" height="24" fill="#ff8a00"></rect>
</g>
<path d="M60 100 H420 A45 45 0 0 1 420 190 H60 A45 45 0 0 0 60 280 H420" fill="none" stroke="#0a0420" stroke-width="2" stroke-dasharray="8 8" opacity="0.7"></path>
<g transform="translate(206 100)">
<rect x="-14" y="-9" width="28" height="18" rx="3" fill="#ffffff"></rect>
<rect x="-14" y="-9" width="28" height="18" rx="3" fill="none" stroke="#0a0420" stroke-width="2"></rect>
<rect x="2" y="-6" width="7" height="12" fill="#0a0420" opacity="0.5"></rect>
<rect x="13" y="-7" width="3" height="4" fill="#ffd23f"></rect>
<rect x="13" y="3" width="3" height="4" fill="#ffd23f"></rect>
<polygon points="16,-7 40,-16 40,-2" fill="#ffd23f" opacity="0.25"></polygon>
<polygon points="16,7 40,2 40,16" fill="#ffd23f" opacity="0.25"></polygon>
</g>
<g transform="translate(172 268)">
<rect x="0" y="0" width="2" height="26" fill="#ffffff"></rect>
<rect x="2" y="0" width="6" height="6" fill="#ffffff"></rect><rect x="8" y="6" width="6" height="6" fill="#ffffff"></rect>
<rect x="8" y="0" width="6" height="6" fill="#0a0420"></rect><rect x="2" y="6" width="6" height="6" fill="#0a0420"></rect>
<rect x="2" y="0" width="12" height="12" fill="none" stroke="#ffffff" stroke-width="1"></rect>
</g>
</svg>

<div style="position: absolute; left: 0; top: 0; width: 480px; height: 40px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; background: #05021a; font-size: 24px">
<svg width="16" height="18" viewBox="0 0 8 9" aria-hidden="true"><polygon points="0,0 8,4.5 0,9" fill="#ffffff"></polygon></svg>
<span class="osd" style="font-size: 28px">SONG</span>
<span style="color: #c9b8ff">DEMO 84</span>
<div style="flex-grow: 1"></div>
<span>BAR 13/88</span>
</div>

<span style="position: absolute; left: 62px; top: 60px; font-size: 20px; color: #b89cff">INTRO</span>
<span style="position: absolute; left: 142px; top: 58px; font-size: 22px; color: #00e5ff">VERSE  X1</span>
<span style="position: absolute; left: 282px; top: 58px; font-size: 22px; color: #ff6fb0">CHORUS</span>
<span style="position: absolute; left: 322px; top: 148px; font-size: 22px; color: #ffd23f">BRIDGE  HALF</span>
<span style="position: absolute; left: 158px; top: 148px; font-size: 22px; color: #ff6fb0">CHORUS  X2</span>
<span style="position: absolute; left: 76px; top: 176px; width: 60px; text-align: center; font-size: 26px; color: #9a8ad0">+</span>
<span style="position: absolute; left: 62px; top: 238px; font-size: 22px; color: #ffb366">OUTRO  TSTOP</span>
<span style="position: absolute; left: 196px; top: 270px; font-size: 20px; color: #c9b8ff">END 3:04</span>

<div style="position: absolute; left: 14px; top: 330px; width: 452px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 22px">
<span>GARAGE</span>
<span style="color: #c9b8ff">5 / 8</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<div style="height: 34px; border: 2px solid #7a2bff; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 20px"><span style="background: #7a2bff; color: #0a0420; padding: 0 4px">A</span><span>INTRO</span><span style="margin-left: auto; color: #c9b8ff">8</span></div>
<div style="height: 34px; border: 2px solid #00e5ff; background: #0e2a40; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 20px"><span style="background: #00e5ff; color: #0a0420; padding: 0 4px">B</span><span>VERSE</span><span style="margin-left: auto; color: #c9b8ff">16</span></div>
<div style="height: 34px; border: 2px solid #ff2a8a; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 20px"><span style="background: #ff2a8a; color: #0a0420; padding: 0 4px">C</span><span>CHORUS</span><span style="margin-left: auto; color: #c9b8ff">16</span></div>
<div style="height: 34px; border: 2px solid #ffd23f; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 20px"><span style="background: #ffd23f; color: #0a0420; padding: 0 4px">D</span><span>BRIDGE</span><span style="margin-left: auto; color: #c9b8ff">8</span></div>
<div style="height: 34px; border: 2px solid #ff8a00; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 20px"><span style="background: #ff8a00; color: #0a0420; padding: 0 4px">E</span><span>OUTRO</span><span style="margin-left: auto; color: #c9b8ff">8</span></div>
<div style="height: 34px; border: 2px dashed #3a2a70; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 20px; color: #6a5aa0"><span>F</span><span>EMPTY</span></div>
<div style="height: 34px; border: 2px dashed #3a2a70; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 20px; color: #6a5aa0"><span>G</span><span>EMPTY</span></div>
<div style="height: 34px; border: 2px dashed #3a2a70; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 20px; color: #6a5aa0"><span>H</span><span>EMPTY</span></div>
</div>
</div>

<div style="position: absolute; left: 0; bottom: 0; width: 480px; height: 36px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 20px; color: #c9b8ff; background: #05021a">
<span>ARP = NEXT PART</span>
<span>HOLD ENV = GARAGE</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px)"></div>
<svg aria-hidden="true" width="480" height="480" style="position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0.08; mix-blend-mode: screen">
<filter id="nz4"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="5"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="480" height="480" filter="url(#nz4)"></rect>
</svg>
<div aria-hidden="true" style="position: absolute; left: 0; top: 236px; width: 480px; height: 4px; pointer-events: none; background: rgba(255,255,255,0.07)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,0.45) 100%)"></div>
</div>
</x-dc>

</body>
</html>
