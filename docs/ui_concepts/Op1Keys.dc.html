<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minimal keys</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00d8ff}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 480px; height: 480px; box-sizing: border-box; padding: 22px 26px; background: #000000; color: #e8e8e8; font-family: 'IBM Plex Mono', monospace; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; letter-spacing: 1px; color: #8a8a8a">
<span>KEYS</span>
<span>WHITE = CHORDS</span>
</div>

<div style="margin-top: 34px; display: flex; flex-direction: column; align-items: center">
<span style="font-size: 96px; font-weight: 300; line-height: 96px; letter-spacing: 4px">DM9</span>
<span style="margin-top: 8px; font-size: 13px; letter-spacing: 3px; color: #6a6a6a">IV  ·  A MINOR</span>
</div>

<div style="margin-top: 34px; position: relative; height: 92px">
<div style="display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; height: 92px">
<sc-for list="{{whites}}" as="w" hint-placeholder-count="16">
<span style="box-sizing: border-box; border: 1px solid {{w.line}}; background: {{w.bg}}"></span>
</sc-for>
</div>
<sc-for list="{{blacks}}" as="b" hint-placeholder-count="11">
<span style="position: absolute; top: 0; width: 14px; height: 52px; background: #000000; border: 1px solid #3a3a3a; box-sizing: border-box; left: {{b.left}}"></span>
</sc-for>
</div>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; font-size: 11px; letter-spacing: 2px; color: #6a6a6a">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #ff3d8b"></span><span>ROOT</span><span style="font-size: 22px; font-weight: 300; color: #e8e8e8; letter-spacing: 0">A</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #00d8ff"></span><span>MODE</span><span style="font-size: 22px; font-weight: 300; color: #e8e8e8; letter-spacing: 0">MINOR</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #ff9a1f"></span><span>CHORD</span><span style="font-size: 22px; font-weight: 300; color: #e8e8e8; letter-spacing: 0">MIN9</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var whites = [];
    for (var i = 0; i < 16; i++) {
      var p = i === 3;
      whites.push({ bg: p ? '#ff3d8b' : '#000000', line: p ? '#ff3d8b' : '#4a4a4a' });
    }
    var after = [0, 1, 2, 4, 5, 7, 8, 9, 11, 12, 14];
    var kw = (428 + 3) / 16;
    var blacks = after.map(function (k) { return { left: Math.round((k + 1) * kw - 8.5) + 'px' }; });
    return { whites: whites, blacks: blacks };
  }
}
</script>
</body>
</html>
