<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    var defs = [
      { name: 'DRM', col: '#ff2a8a', kind: 'drum' },
      { name: 'BAS', col: '#ff8a00', kind: 'bass' },
      { name: 'PAD', col: '#00e5ff', kind: 'pad' },
      { name: 'KEY', col: '#7a2bff', kind: 'arp' },
      { name: 'LED', col: '#ffd23f', kind: 'lead', rec: true },
      { name: 'FX',  col: '#6dff9a', kind: 'fx' }
    ];
    var W = 368;
    var seed = 17;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    var lanes = defs.map(function (d) {
      var blocks = [];
      var i, x;
      if (d.kind === 'drum') {
        for (i = 0; i < 32; i++) blocks.push({ left: (i * W / 32) + 'px', w: '4px', top: (i % 4 === 0 ? 2 : 6) + 'px', h: (i % 4 === 0 ? 11 : 5) + 'px', c: d.col });
      } else if (d.kind === 'bass') {
        for (i = 0; i < 16; i++) blocks.push({ left: (i * W / 16) + 'px', w: '14px', top: (3 + (i % 4 === 2 ? 0 : 5)) + 'px', h: '5px', c: d.col });
      } else if (d.kind === 'pad') {
        for (i = 0; i < 4; i++) blocks.push({ left: (i * W / 4 + 1) + 'px', w: (W / 4 - 4) + 'px', top: (2 + (i % 2) * 4) + 'px', h: '7px', c: d.col });
      } else if (d.kind === 'arp') {
        for (i = 0; i < 48; i++) blocks.push({ left: (i * W / 48) + 'px', w: '5px', top: (2 + Math.floor(rnd() * 9)) + 'px', h: '3px', c: d.col });
      } else if (d.kind === 'lead') {
        x = 0;
        while (x < W * 0.62) {
          var len = 10 + Math.floor(rnd() * 30);
          var fresh = x > W * 0.42;
          blocks.push({ left: x + 'px', w: Math.min(len, W * 0.62 - x) + 'px', top: (1 + Math.floor(rnd() * 10)) + 'px', h: '3px', c: fresh ? '#ff2a4a' : d.col });
          x += len + 4 + Math.floor(rnd() * 10);
        }
      } else {
        blocks.push({ left: (W * 0.18) + 'px', w: '40px', top: '4px', h: '7px', c: d.col });
        blocks.push({ left: (W * 0.86) + 'px', w: '30px', top: '4px', h: '7px', c: d.col });
      }
      return { name: d.name, col: d.col, blocks: blocks, rowBg: d.rec ? '#2a1238' : 'transparent', dot: d.rec ? '#ff2a4a' : 'transparent' };
    });
    return { lanes: lanes };
  }
}
</script>
