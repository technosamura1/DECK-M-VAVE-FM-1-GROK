# Сборка прошивки DECK в облаке GitHub (Linux-тулчейн JieLi).
# Два задания: test — тесты на хосте (симулятор, сценарии, синхронизация по Bluetooth); build — прошивка для каждой кассеты.
# Bluetooth (ble = true в deck/fm1.toml.in) собирается на закрытых библиотеках JieLi (btctrler.a, btstack.a): их нет в репозитории,
# build скачивает SDK скриптом base/bsp/tools/get_sdk.sh (GitHub JieLi удалён → Gitee JieLi, ~0,5 ГБ, кэшируется).
# Если SDK скачать не удалось (Gitee недоступен), прошивка собирается БЕЗ Bluetooth (--no-ble, архив deck-<кассета>-usb.zip)
# и в логе остаётся предупреждение: такая сборка Bluetooth не проверяет. Для USB-упаковки хватает 3 файлов из ci/ac79-sdk.
# На каждый push и PR: собирает .fwsc для каждой кассеты из tapes/ и кладёт архив «к установке» в Artifacts.
# На push в main: дополнительно обновляет релиз «latest» — оттуда прошивку удобно скачать с телефона/ПК.
name: firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-пакеты тестов
        run: pip install --quiet pillow numpy mido

      - name: Симулятор и тесты (сценарии, bsp/ble, синхронизация по Bluetooth)
        run: |
          set -e
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec gcc -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE "$@"\n' > "$HOME/bin/gccp"
          chmod +x "$HOME/bin/gccp"
          export CC="$HOME/bin/gccp"
          sh build.sh overworld --host > host-build.log 2>&1 || { tail -n 30 host-build.log; exit 1; }
          sh tests/run_tests.sh > tests.log 2>&1 || true
          grep -E "^ +(ok|FAIL) |^--|ALL OK|TESTS FAILED|sync_test" tests.log || true
          tail -n 2 tests.log
          grep -q "ALL OK" tests.log
          sh base/bsp/tests/run_ble_test.sh > ble-test.log 2>&1 || true
          tail -n 2 ble-test.log
          grep -q " 0 failed" ble-test.log

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-пакеты сборки
        run: pip install --quiet pillow

      - name: Кэш тулчейна JieLi
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-linux-tc-v1

      - name: Скачать тулчейн JieLi
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh base/tools/get_toolchain.sh ~/.jieli

      - name: Кэш SDK JieLi (библиотеки Bluetooth)
        id: sdkcache
        uses: actions/cache@v4
        with:
          path: ~/ac79-sdk
          key: ac79-sdk-d179b44-v1

      - name: Скачать SDK JieLi (Gitee; нужен для Bluetooth)
        id: sdk
        run: |
          if sh base/bsp/tools/get_sdk.sh "$HOME/ac79-sdk"; then
            echo "ble=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SDK JieLi не скачался (GitHub JieLi удалён, Gitee недоступен): прошивка соберётся БЕЗ Bluetooth (--no-ble)"
            echo "ble=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Файлы SDK для упаковки (из ci/ac79-sdk, со сверкой SHA-256)
        run: |
          cd ci/ac79-sdk
          sha256sum -c - <<'SUMS'
          4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4  cpu/wl82/tools/uboot.boot
          276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b  cpu/wl82/tools/cfg_tool.bin
          41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d  cpu/wl82/tools/cfg/eq_cfg_hw.bin
          SUMS

      - name: Собрать прошивку для каждой кассеты
        env:
          JIELI_TOOLCHAIN: /home/runner/.jieli/toolchain
          BLE: ${{ steps.sdk.outputs.ble }}
        run: |
          set -e
          if [ "$BLE" = 1 ]; then
            export AC79_SDK="$HOME/ac79-sdk"; OPT=""; SFX=""
          else
            export AC79_SDK="$GITHUB_WORKSPACE/ci/ac79-sdk"; OPT="--no-ble"; SFX="-usb"
          fi
          mkdir -p dist
          for t in $(ls tapes); do
            echo "::group::$t"
            if ! sh build.sh "$t" $OPT > "build-$t.log" 2>&1; then
              tail -n 30 "build-$t.log" | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            fi
            grep -E "image .* RAM|parts " "build-$t.log" || true
            tail -n 3 "build-$t.log"
            echo "::notice::deck-$t.fwsc md5 $(md5sum out/deck-$t.fwsc | cut -c1-32)"
            d="dist/deck-$t"
            mkdir -p "$d"
            cp "out/deck-$t.fwsc" out/fm1_install.py "$d/"
            sed "s/deck-overworld.fwsc/deck-$t.fwsc/; s/DECK + OVERWORLD/DECK + $(echo $t | tr a-z A-Z)/" out/install-deck.bat > "$d/install-deck.bat"
            [ -f "out/DECK_инструкция.pdf" ] && cp "out/DECK_инструкция.pdf" "$d/" || true
            (cd dist && zip -qr "deck-$t$SFX.zip" "deck-$t")
            echo "::endgroup::"
          done
          ls -la dist

      - name: Архив в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deck-firmware-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30

      - name: Релиз «latest» (только main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.zip \
            --title "Свежая прошивка (${GITHUB_SHA::7})" \
            --notes "Собрано автоматически из main. Скачай deck-<кассета>.zip, распакуй на ПК, подключи FM-1 по USB и запусти install-deck.bat. Лучше на второй FM-1." \
            --latest
